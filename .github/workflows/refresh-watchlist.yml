name: Refresh smart watchlist

# Daily (pre-open, weekdays) rebuild of the dynamic watchlist -- rescores growth,
# undervaluation, and leading sectors, then commits data/smart_tickers.csv so the
# Dashboard workflow renders the fresh list. Analogous to Dad's daily mlbuild.
# Runs on the default branch; needs contents:write to commit.

on:
  schedule:
    - cron: "0 12 * * 1-5"   # ~08:00 ET (12:00 UTC), weekday mornings
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen || uv sync
      - name: Rebuild smart watchlist
        run: uv run stockskill smart-watchlist --out data/smart_tickers.csv
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/smart_tickers.csv
          git commit -m "chore: refresh smart watchlist [skip ci]" || echo "no changes"
          git push || echo "nothing to push"
