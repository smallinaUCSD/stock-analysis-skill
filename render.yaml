# Render Blueprint — one-click deploy of the PUBLIC dashboard.
# In Render: New +  ->  Blueprint  ->  connect this repo. Free tier, HTTPS + URL.
services:
  - type: web
    name: stockskill
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: STOCKSKILL_PUBLIC
        value: "1"
      - key: STOCKSKILL_TICKERS
        value: "data/tickers.csv"          # the full watchlist (built from cache)
      - key: STOCKSKILL_PERIOD
        value: "5y"                        # 5 years of history on the board/charts
      - key: STOCKSKILL_CACHE_DIR
        value: "data/cache"                # committed data snapshot (built locally)
      - key: STOCKSKILL_CACHE_TTL
        value: "2592000"                   # 30d: always serve the committed snapshot
                                           # (never bulk-refetch 116 tickers via FMP —
                                           #  that would blow the free ~250 calls/day)
      - key: STOCKSKILL_BMC_URL
        sync: false      # set your Buy-me-a-coffee URL in the Render dashboard
      - key: FMP_API_KEY
        sync: false      # Financial Modeling Prep key — fundamentals + add/indicators/
                         # evaluate (single-symbol) despite Yahoo IP-blocking
      - key: FINNHUB_API_KEY
        sync: false      # Finnhub key — real-time quotes for the live board overlay
                         # (FMP free tier blocks multi-symbol batch quotes)
      - key: UPSTASH_REDIS_REST_URL
        sync: false      # Upstash Redis REST URL — persists user-added tickers so
                         # they survive restarts/redeploys (host disk is ephemeral)
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false      # Upstash Redis REST token (pairs with the URL above)
